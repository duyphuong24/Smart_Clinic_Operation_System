<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout('Doctors', ~{::content_fragment})}">
<body>
    <div th:fragment="content_fragment">
        <div class="glass-panel p-4" style="max-width: 600px; margin: 0 auto;">
            <!-- Header Section -->
            <div class="mb-4">
                <h3 class="fw-bold m-0 text-white">Add Working Schedule</h3>
                <p class="text-secondary m-0" style="font-size: 0.9rem;">
                    Configure a new availability slot for <span class="text-white fw-semibold" th:text="${doctor.fullName}">Dr. B</span>.
                </p>
            </div>

            <!-- Form -->
            <form th:action="@{/admin/doctors/{id}/availability/new(id=${doctor.id})}" th:object="${availability}" method="post">
                <div class="row g-4">
                    <!-- Day of Week -->
                    <div class="col-12">
                        <div class="form-group">
                            <label for="dayOfWeek" class="form-label">Day of Week <span class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <select id="dayOfWeek" th:field="*{dayOfWeek}" class="form-control-custom" style="appearance: none; background-image: url('data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%239ca3af%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpolyline points=%226 9 12 15 18 9%22%3E%3C/polyline%3E%3C/svg%3E'); background-repeat: no-repeat; background-position: right 16px center; background-size: 16px;" required>
                                    <option value="" disabled selected>Select Day</option>
                                    <option value="1">Monday</option>
                                    <option value="2">Tuesday</option>
                                    <option value="3">Wednesday</option>
                                    <option value="4">Thursday</option>
                                    <option value="5">Friday</option>
                                    <option value="6">Saturday</option>
                                    <option value="7">Sunday</option>
                                </select>
                            </div>
                            <div class="text-danger mt-1" th:if="${#fields.hasErrors('dayOfWeek')}" th:errors="*{dayOfWeek}" style="font-size: 0.8rem;">Day Error</div>
                        </div>
                    </div>

                    <!-- Start Time -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="startTime" class="form-label">Start Time <span class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <input type="time" id="startTime" th:field="*{startTime}" class="form-control-custom" required>
                            </div>
                            <div class="text-danger mt-1" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}" style="font-size: 0.8rem;">Start Time Error</div>
                        </div>
                    </div>

                    <!-- End Time -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="endTime" class="form-label">End Time <span class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <input type="time" id="endTime" th:field="*{endTime}" class="form-control-custom" required>
                            </div>
                            <div class="text-danger mt-1" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}" style="font-size: 0.8rem;">End Time Error</div>
                        </div>
                    </div>

                    <!-- Slot Minutes -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="slotMinutes" class="form-label">Slot Duration (Minutes) <span class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <input type="number" id="slotMinutes" th:field="*{slotMinutes}" class="form-control-custom" placeholder="e.g. 20" min="1" required>
                            </div>
                            <div class="text-danger mt-1" th:if="${#fields.hasErrors('slotMinutes')}" th:errors="*{slotMinutes}" style="font-size: 0.8rem;">Slot Error</div>
                        </div>
                    </div>

                    <!-- Room Selection -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="roomId" class="form-label">Assigned Room <span class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <select id="roomId" th:field="*{roomId}" class="form-control-custom" style="appearance: none; background-image: url('data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%239ca3af%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpolyline points=%226 9 12 15 18 9%22%3E%3C/polyline%3E%3C/svg%3E'); background-repeat: no-repeat; background-position: right 16px center; background-size: 16px;" required>
                                    <option value="" disabled selected>Select Room</option>
                                    <option th:each="room : ${rooms}" 
                                            th:value="${room.id}" th:text="${room.name} + ' (' + ${room.roomCode} + ')'"></option>
                                </select>
                            </div>
                            <div class="text-danger mt-1" th:if="${#fields.hasErrors('roomId')}" th:errors="*{roomId}" style="font-size: 0.8rem;">Room Error</div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-end gap-3 mt-4 pt-3" style="border-top: 1px solid var(--border-card);">
                    <a th:href="@{/admin/doctors/{id}(id=${doctor.id})}" class="btn btn-outline-secondary px-4 py-2" style="border-radius: var(--border-radius-sm); border-color: var(--border-card); font-family: var(--font-heading); font-weight: 500;">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-premium px-4 py-2" style="width: auto; font-family: var(--font-heading); font-weight: 600;">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Save Schedule
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
