<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Smart Clinic</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card glass-panel">
            <div class="login-header">
                <div class="login-logo">Smart Clinic</div>
                <div class="login-subtitle">Operations System</div>
            </div>

            <!-- Login Status/Error Messages -->
            <div th:if="${param.error}" class="alert-custom alert-danger-custom">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>Invalid username or password.</span>
            </div>
            
            <div th:if="${param.logout}" class="alert-custom alert-success-custom">
                <i class="fa-solid fa-circle-check"></i>
                <span>You have been logged out successfully.</span>
            </div>

            <div th:if="${param.expired}" class="alert-custom alert-danger-custom" style="background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.2); color: #fde047;">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Session expired, please login again.</span>
            </div>

            <!-- Form -->
            <form th:action="@{/process-login}" method="post">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-glow-wrapper">
                        <input type="text" id="username" name="username" class="form-control-custom" placeholder="e.g. admin" required autofocus autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-glow-wrapper">
                        <input type="password" id="password" name="password" class="form-control-custom" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn-premium mt-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
                </button>
            </form>

            <div class="login-footer-text">
                Smart Clinic © 2026. All rights reserved.
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
