<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout('Doctors', ~{::content_fragment})}">
<body>
    <div th:fragment="content_fragment">
        <!-- Link to Module-Specific CSS -->
        <link th:href="@{/css/doctor.css}" rel="stylesheet">

        <div class="glass-panel p-4 doctor-form-panel">
            <!-- Header Section -->
            <div class="mb-4">
                <h3 class="fw-bold m-0 text-white" th:text="${isEdit} ? 'Edit Doctor Profile' : 'Add Doctor Profile'">Add Doctor Profile</h3>
                <p class="text-secondary m-0 text-sm">Associate a staff member with a specialty, default room, and consultation fee.</p>
            </div>

            <!-- Form -->
            <form th:action="${isEdit} ? @{/admin/doctors/{id}/edit(id=${doctorId})} : @{/admin/doctors/new}" th:object="${doctor}" method="post">
                <div class="row g-4">
                    <!-- Staff Selection -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="staffId" class="form-label">Linked Staff Member <span class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <select id="staffId" th:field="*{staffId}" class="form-control-custom select-custom-arrow" th:disabled="${isEdit}">
                                    <option value="" disabled selected>Select Staff</option>
                                    <option th:each="st : ${staffs}" 
                                            th:value="${st.id}" th:text="${st.fullName} + ' (' + ${st.employeeCode} + ')'"></option>
                                </select>
                            </div>
                            <input type="hidden" th:if="${isEdit}" th:field="*{staffId}">
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('staffId')}" th:errors="*{staffId}">Staff Error</div>
                        </div>
                    </div>

                    <!-- Specialty Selection -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="specialtyId" class="form-label">Specialty <span class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <select id="specialtyId" th:field="*{specialtyId}" class="form-control-custom select-custom-arrow">
                                    <option value="" disabled selected>Select Specialty</option>
                                    <option th:each="spec : ${specialties}" 
                                            th:value="${spec.id}" th:text="${spec.name}"></option>
                                </select>
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('specialtyId')}" th:errors="*{specialtyId}">Specialty Error</div>
                        </div>
                    </div>

                    <!-- Default Room Selection -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="defaultRoomId" class="form-label">Default Room</label>
                            <div class="input-glow-wrapper">
                                <select id="defaultRoomId" th:field="*{defaultRoomId}" class="form-control-custom select-custom-arrow">
                                    <option value="" selected>No Default Room</option>
                                    <option th:each="room : ${rooms}" 
                                            th:value="${room.id}" th:text="${room.name} + ' (' + ${room.roomCode} + ')'"></option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- License Number -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="licenseNo" class="form-label">License Number <span class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <input type="text" id="licenseNo" th:field="*{licenseNo}" class="form-control-custom" placeholder="e.g. LIC-123456" required>
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('licenseNo')}" th:errors="*{licenseNo}">License Error</div>
                        </div>
                    </div>

                    <!-- Consultation Fee -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="consultationFee" class="form-label">Consultation Fee (VND) <span class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <input type="number" id="consultationFee" th:field="*{consultationFee}" class="form-control-custom" placeholder="e.g. 150000" step="1000" min="0" required>
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('consultationFee')}" th:errors="*{consultationFee}">Fee Error</div>
                        </div>
                    </div>

                    <!-- Active status (Only during edit) -->
                    <div class="col-md-6 d-flex align-items-center pt-3" th:if="${isEdit}">
                        <div class="form-check form-switch p-0 d-flex align-items-center gap-3">
                            <label class="form-label m-0 cursor-pointer" for="active">Active Status</label>
                            <input class="form-check-input ms-0 masterdata-checkbox" type="checkbox" id="active" th:field="*{active}">
                        </div>
                    </div>

                    <!-- Bio -->
                    <div class="col-12">
                        <div class="form-group">
                            <label for="bio" class="form-label">Biography / Background</label>
                            <div class="input-glow-wrapper">
                                <textarea id="bio" th:field="*{bio}" class="form-control-custom" rows="4" placeholder="Brief details about doctor's qualifications, expertise..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top-card">
                    <a th:href="@{/admin/doctors}" class="btn btn-outline-secondary px-4 py-2 btn-cancel-custom">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-premium px-4 py-2 btn-premium-custom">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Save Doctor Profile
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
