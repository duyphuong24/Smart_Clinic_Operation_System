<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout('Doctors', ~{::content_fragment})}">
<body>
    <div th:fragment="content_fragment">
        <div class="glass-panel p-4">
            <!-- Header Section -->
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h3 class="fw-bold m-0 text-white">Doctor Profiles</h3>
                    <p class="text-secondary m-0" style="font-size: 0.9rem;">View and manage doctor records, fees, and working hours.</p>
                </div>
                <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/admin/doctors/new}" class="btn btn-premium d-flex align-items-center gap-2" style="width: auto; padding: 10px 20px;">
                    <i class="fa-solid fa-user-doctor"></i>
                    <span>Add Doctor</span>
                </a>
            </div>

            <!-- Table -->
            <div class="table-responsive">
                <table class="table table-hover align-middle text-white m-0" style="border-collapse: separate; border-spacing: 0 8px;">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--border-card); color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;">
                            <th class="ps-3 py-3" style="width: 15%">Emp Code</th>
                            <th style="width: 25%">Full Name</th>
                            <th style="width: 20%">Specialty</th>
                            <th style="width: 15%">License No</th>
                            <th style="width: 15%">Fee (VND)</th>
                            <th style="width: 10%">Status</th>
                            <th class="pe-3 text-end" style="width: 10%">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="doc : ${doctors}" class="glass-panel" style="background: rgba(255,255,255,0.01); border: 1px solid var(--border-card); margin-bottom: 8px;">
                            <td class="ps-3 py-3">
                                <span class="badge bg-secondary font-monospace px-2 py-2" th:text="${doc.employeeCode}" style="font-size: 0.85rem; letter-spacing: 0.05em;">EMP-001</span>
                            </td>
                            <td>
                                <span class="fw-semibold text-white" th:text="${doc.fullName}">Dr. Nguyen Van B</span>
                            </td>
                            <td th:text="${doc.specialtyName}">General Medicine</td>
                            <td th:text="${doc.licenseNo}">LIC-12345</td>
                            <td th:text="${#numbers.formatDecimal(doc.consultationFee, 1, 'COMMA', 0, 'POINT')} + ' ₫'">150,000 ₫</td>
                            <td>
                                <span class="badge" th:classappend="${doc.active ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-danger-subtle text-danger border border-danger-subtle'}" th:text="${doc.active ? 'ACTIVE' : 'INACTIVE'}" style="font-size: 0.75rem; padding: 6px 12px; border-radius: 20px;">ACTIVE</span>
                            </td>
                            <td class="pe-3 text-end">
                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="@{/admin/doctors/{id}(id=${doc.id})}" class="btn btn-sm btn-outline-info" title="View Availability & Schedule" style="border-radius: 6px; padding: 6px 10px;">
                                        <i class="fa-solid fa-calendar-days"></i>
                                    </a>
                                    <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/admin/doctors/{id}/edit(id=${doc.id})}" class="btn btn-sm btn-outline-warning" title="Edit Doctor Profile" style="border-radius: 6px; padding: 6px 10px;">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <!-- Empty State -->
                        <tr th:if="${#lists.isEmpty(doctors)}">
                            <td colspan="7" class="text-center py-5 text-secondary">
                                <i class="fa-solid fa-folder-open mb-3" style="font-size: 3rem; opacity: 0.3;"></i>
                                <p class="m-0">No doctor profiles found.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
