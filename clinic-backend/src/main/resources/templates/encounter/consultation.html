<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout('Consultation', ~{::content_fragment})}">
<body>
    <div th:fragment="content_fragment">
        <div class="glass-panel p-4">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h3 class="fw-bold m-0 text-white">Consultation Desk</h3>
                    <p class="text-secondary m-0" style="font-size: 0.9rem;">Patients currently in service and ready for clinical encounter workflow.</p>
                </div>
                <a th:href="@{/queue}" class="btn btn-outline-primary px-3" style="border-radius: 6px;">
                    <i class="fa-solid fa-users-rectangle me-2"></i>Queue Board
                </a>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle text-white m-0" style="border-collapse: separate; border-spacing: 0 8px;">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--border-card); color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;">
                            <th class="ps-3 py-3">Queue No</th>
                            <th>Patient</th>
                            <th>Doctor</th>
                            <th>Room</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${queueItems}" class="glass-panel" style="background: rgba(255,255,255,0.01); border: 1px solid var(--border-card);">
                            <td class="ps-3 py-3">
                                <span class="badge bg-secondary font-monospace px-3 py-2" th:text="${item.queueNumber}">1</span>
                            </td>
                            <td>
                                <span class="fw-semibold text-white d-block" th:text="${item.patientName}">Patient</span>
                                <span class="text-secondary font-monospace" th:text="${item.patientCode}" style="font-size: 0.75rem;">PT-00001</span>
                            </td>
                            <td th:text="${item.doctorName}">Doctor</td>
                            <td>
                                <span class="badge bg-dark-subtle border border-secondary text-secondary" th:text="${item.roomCode != null && !item.roomCode.isEmpty() ? item.roomCode : '-'}">ROOM</span>
                            </td>
                            <td>
                                <span class="badge bg-primary-subtle text-primary border border-primary" th:text="${item.status}">IN_SERVICE</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(queueItems)}">
                            <td colspan="5" class="text-center py-5 text-secondary">
                                <i class="fa-solid fa-stethoscope mb-3" style="font-size: 3rem; opacity: 0.3;"></i>
                                <p class="m-0">No patient is currently in service.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
