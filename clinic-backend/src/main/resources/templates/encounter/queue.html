<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout('Consultation', ~{::content_fragment})}">
<body>
    <div th:fragment="content_fragment">
        <!-- Error Alert if doctor profile is not linked -->
        <div th:if="${error != null}" class="alert-custom alert-danger-custom mb-4">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span th:text="${error}">Error Message</span>
        </div>

        <div th:if="${doctor != null}" class="glass-panel p-4">
            <!-- Header Section -->
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h3 class="fw-bold m-0 text-white">Consultation Queue</h3>
                    <p class="text-secondary m-0" style="font-size: 0.9rem;">
                        Logged in as: <span class="text-white fw-semibold" th:text="${doctor.fullName}">Dr. B</span> 
                        | Specialty: <span class="text-white fw-semibold" th:text="${doctor.specialtyName}">General</span>
                    </p>
                </div>
            </div>

            <!-- Table -->
            <div class="table-responsive">
                <table class="table table-hover align-middle text-white m-0" style="border-collapse: separate; border-spacing: 0 8px;">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--border-card); color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;">
                            <th class="ps-3 py-3" style="width: 10%">No</th>
                            <th style="width: 30%">Patient</th>
                            <th style="width: 20%">Priority</th>
                            <th style="width: 20%">Status</th>
                            <th class="pe-3 text-end" style="width: 20%">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${queueItems}" class="glass-panel" style="background: rgba(255,255,255,0.01); border: 1px solid var(--border-card); margin-bottom: 8px;">
                            <td class="ps-3 py-3">
                                <span class="badge bg-secondary font-monospace px-3 py-2" th:text="${item.queueNumber}" style="font-size: 0.95rem; font-weight: 700; width: 45px; display: inline-block; text-align: center;">1</span>
                            </td>
                            <td>
                                <span class="fw-semibold text-white d-block" th:text="${item.patient.fullName}">Nguyen Van A</span>
                                <span class="text-secondary font-monospace" th:text="${item.patient.patientCode}" style="font-size: 0.75rem;">PT-00001</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${
                                    item.priority.name() == 'NORMAL' ? 'bg-secondary-subtle text-secondary border border-secondary-subtle' : 
                                    item.priority.name() == 'HIGH' ? 'bg-warning-subtle text-warning border border-warning-subtle' : 
                                    'bg-danger-subtle text-danger border border-danger-subtle'}" 
                                      th:text="${item.priority}">NORMAL</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${
                                    item.status.name() == 'WAITING' ? 'bg-secondary-subtle text-secondary border border-secondary-subtle' : 
                                    item.status.name() == 'CALLED' ? 'bg-info-subtle text-info border border-info-subtle' : 
                                    item.status.name() == 'IN_SERVICE' ? 'bg-primary-subtle text-primary border border-primary-subtle' : 
                                    item.status.name() == 'DONE' ? 'bg-success-subtle text-success border border-success-subtle' : 
                                    'bg-danger-subtle text-danger border border-danger-subtle'}" 
                                      th:text="${item.status}">WAITING</span>
                            </td>
                            <td class="pe-3 text-end">
                                <div class="d-flex justify-content-end gap-2">
                                    <!-- Call patient -->
                                    <form th:if="${item.status.name() == 'WAITING'}" th:action="@{/queue/{id}/call(id=${item.id})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-outline-info" style="border-radius: 6px; padding: 6px 12px; font-weight: 500;">
                                            <i class="fa-solid fa-bullhorn me-1"></i>Call
                                        </button>
                                    </form>

                                    <!-- Start Consultation -->
                                    <form th:if="${item.status.name() == 'CALLED' || item.status.name() == 'WAITING'}" th:action="@{/consultation/start(queueItemId=${item.id})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-premium" style="width: auto; border-radius: 6px; padding: 6px 12px; font-weight: 500;">
                                            <i class="fa-solid fa-user-doctor me-1"></i>Start Consult
                                        </button>
                                    </form>

                                    <!-- Continue Consultation -->
                                    <form th:if="${item.status.name() == 'IN_SERVICE'}" th:action="@{/consultation/start(queueItemId=${item.id})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-primary" style="border-radius: 6px; padding: 6px 12px; font-weight: 500;">
                                            <i class="fa-solid fa-chevron-right me-1"></i>Resume
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <!-- Empty State -->
                        <tr th:if="${#lists.isEmpty(queueItems)}">
                            <td colspan="5" class="text-center py-5 text-secondary">
                                <i class="fa-solid fa-notes-medical mb-3" style="font-size: 3rem; opacity: 0.3;"></i>
                                <p class="m-0">No patients waiting in your queue.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
