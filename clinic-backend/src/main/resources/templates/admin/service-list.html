<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Medical Services Catalog - Smart Clinic</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-navy mb-1"><i class="bi bi-journal-medical me-2"></i>Medical Services & Pricing</h2>
            <p class="text-muted mb-0">Manage clinic services, consultation fees, and lab test pricing</p>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form th:action="@{/admin/services}" method="get" class="row g-3 align-items-center">
                <div class="col-md-4">
                    <label class="form-label small text-muted">Filter by Service Type</label>
                    <select name="type" class="form-select" onchange="this.form.submit()">
                        <option value="">All Types</option>
                        <option th:each="t : ${serviceTypes}"
                                th:value="${t}"
                                th:text="${t}"
                                th:selected="${t == selectedType}">LAB_TEST</option>
                    </select>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Code</th>
                        <th>Service Name</th>
                        <th>Category Type</th>
                        <th class="text-end">UnitPrice (₫)</th>
                        <th class="text-center">Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="service : ${services}">
                        <td class="ps-4 font-monospace fw-bold text-primary" th:text="${service.serviceCode}">LAB-001</td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${service.name}">Blood Test</div>
                            <small class="text-muted" th:text="${service.description}">Standard CBC blood panel</small>
                        </td>
                        <td>
                            <span class="badge bg-info text-dark" th:text="${service.type}">LAB_TEST</span>
                        </td>
                        <td class="text-end fw-bold text-navy" th:text="${#numbers.formatDecimal(service.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">150,000 ₫</td>
                        <td class="text-center">
                            <span th:if="${service.active}" class="badge bg-success">Active</span>
                            <span th:unless="${service.active}" class="badge bg-secondary">Inactive</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(services)}">
                        <td colspan="5" class="text-center py-4 text-muted">No medical services found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
