<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>User Accounts Management - Smart Clinic</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-navy mb-1"><i class="bi bi-person-gear me-2"></i>System User Accounts</h2>
            <p class="text-muted mb-0">Manage system login credentials, role assignments, and account statuses</p>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Phone</th>
                        <th>Roles</th>
                        <th>Status</th>
                        <th>Created At</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${users}">
                        <td class="ps-4 fw-semibold" th:text="${u.id}">1</td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${u.userName}">admin</div>
                        </td>
                        <td>
                            <div class="text-navy fw-semibold" th:text="${u.fullName}">Nguyen Van A</div>
                        </td>
                        <td class="text-muted" th:text="${u.phone != null ? u.phone : 'N/A'}">0901234567</td>
                        <td>
                            <span th:each="r : ${u.roles}"
                                  class="badge bg-secondary me-1"
                                  th:text="${r.name}">ROLE_ADMIN</span>
                        </td>
                        <td>
                            <span th:if="${u.status != null and u.status.name() == 'ACTIVE'}" class="badge bg-success"><i class="bi bi-check-circle me-1"></i>ACTIVE</span>
                            <span th:unless="${u.status != null and u.status.name() == 'ACTIVE'}" class="badge bg-danger"><i class="bi bi-x-circle me-1"></i>LOCKED</span>
                        </td>
                        <td class="text-muted" th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-22 10:00</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="7" class="text-center py-4 text-muted">No user accounts found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
