<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout('Master Data', ~{::content_fragment})}">
<body>
    <div th:fragment="content_fragment">
        <!-- Link to Module-Specific CSS -->
        <link th:href="@{/css/masterdata.css}" rel="stylesheet">

        <div class="glass-panel p-4 masterdata-form-panel">
            <!-- Header Section -->
            <div class="mb-4">
                <h3 class="fw-bold m-0 text-white" th:text="${isEdit} ? 'Edit Room' : 'Add Room'">Add Room</h3>
                <p class="text-secondary m-0 text-sm">Configure physical rooms or desks inside the clinic.</p>
            </div>

            <!-- Form -->
            <form th:action="${isEdit} ? @{/admin/rooms/{id}/edit(id=${roomId})} : @{/admin/rooms/new}" th:object="${room}" method="post">
                <div class="row g-4">
                    <!-- Room Code -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="roomCode" class="form-label">Room Code <span class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <input type="text" id="roomCode" th:field="*{roomCode}" class="form-control-custom" placeholder="e.g. ROOM-101" required th:disabled="${isEdit}">
                            </div>
                            <!-- Hidden input because disabled inputs are not submitted in POST forms -->
                            <input type="hidden" th:if="${isEdit}" th:field="*{roomCode}">
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('roomCode')}" th:errors="*{roomCode}">Room Code Error</div>
                        </div>
                    </div>

                    <!-- Room Name -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="name" class="form-label">Room Name <span class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <input type="text" id="name" th:field="*{name}" class="form-control-custom" placeholder="e.g. Consultation Room 1" required>
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</div>
                        </div>
                    </div>

                    <!-- Floor -->
                    <div class="col-12">
                        <div class="form-group">
                            <label for="floor" class="form-label">Floor</label>
                            <div class="input-glow-wrapper">
                                <input type="text" id="floor" th:field="*{floor}" class="form-control-custom" placeholder="e.g. 1st Floor / Ground Floor">
                            </div>
                        </div>
                    </div>

                    <!-- Active status (Only during edit) -->
                    <div class="col-12" th:if="${isEdit}">
                        <div class="form-check form-switch p-0 d-flex align-items-center gap-3">
                            <label class="form-label m-0 cursor-pointer" for="active">Active Status</label>
                            <input class="form-check-input ms-0 masterdata-checkbox" type="checkbox" id="active" th:field="*{active}">
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top-card">
                    <a th:href="@{/admin/rooms}" class="btn btn-outline-secondary px-4 py-2 btn-cancel-custom">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-premium px-4 py-2 btn-premium-custom">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Save Room
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
