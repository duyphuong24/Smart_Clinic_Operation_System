<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout('Audit Logs', ~{::content_fragment})}">
<body>
    <div th:fragment="content_fragment">
        <!-- Header -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h3 class="fw-bold m-0 text-white"><i class="fa-solid fa-clock-rotate-left me-2 text-warning"></i>Audit Logs</h3>
                <p class="text-secondary m-0 text-sm">System audit trail and security activity history.</p>
            </div>
        </div>

        <!-- Logs Table -->
        <div class="glass-panel p-4">
            <div class="table-responsive">
                <table class="table align-middle text-white m-0">
                    <thead>
                        <tr class="border-bottom text-secondary text-badge-sz text-uppercase">
                            <th class="w-20">Timestamp</th>
                            <th class="w-15">User</th>
                            <th class="w-15">Action</th>
                            <th class="w-15">Resource</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${logs}" class="border-bottom border-secondary-subtle">
                            <td class="py-3 font-monospace text-xs text-white-50" th:text="${#temporals.format(log.createdAt, 'dd-MM-yyyy HH:mm:ss')}">20-07-2026 12:00:00</td>
                            <td><span class="badge bg-secondary text-white text-xs" th:text="${log.username != null ? log.username : 'SYSTEM'}">admin</span></td>
                            <td><span class="badge bg-warning-subtle text-warning text-xs" th:text="${log.action}">CREATE</span></td>
                            <td class="font-monospace text-xs text-info" th:text="${log.resource != null ? log.resource : '-'}">PATIENT</td>
                            <td class="text-xs text-white-50" th:text="${log.details}">Patient record created successfully</td>
                        </tr>
                        <tr th:if="${logs == null or logs.isEmpty()}">
                            <td colspan="5" class="text-center py-4 text-secondary">
                                <i class="fa-solid fa-inbox me-2"></i>No audit logs recorded yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
