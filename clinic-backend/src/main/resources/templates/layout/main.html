<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Smart Clinic'"></title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <span class="sidebar-brand">Smart Clinic</span>
            </div>
            
            <nav class="sidebar-menu">
                <!-- Dashboard (All logged-in roles) -->
                <a th:href="@{/dashboard}" th:classappend="${title == 'Dashboard' ? 'active' : ''}" class="menu-item-link">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                
                <!-- Patient Registry (Admin, Receptionist, Doctor) -->
                <a sec:authorize="hasAnyRole('ROLE_ADMIN', 'ROLE_RECEPTIONIST', 'ROLE_DOCTOR')" 
                   th:href="@{/patients}" th:classappend="${title == 'Patients' ? 'active' : ''}" class="menu-item-link">
                    <i class="fa-solid fa-user-injured"></i>
                    <span>Patients</span>
                </a>
                
                <!-- Appointments (Admin, Receptionist) -->
                <a sec:authorize="hasAnyRole('ROLE_ADMIN', 'ROLE_RECEPTIONIST')" 
                   th:href="@{/appointments}" th:classappend="${title == 'Appointments' ? 'active' : ''}" class="menu-item-link">
                    <i class="fa-solid fa-calendar-check"></i>
                    <span>Appointments</span>
                </a>
                
                <!-- Queue Board (Admin, Receptionist, Doctor) -->
                <a sec:authorize="hasAnyRole('ROLE_ADMIN', 'ROLE_RECEPTIONIST', 'ROLE_DOCTOR')" 
                   th:href="@{/queue}" th:classappend="${title == 'Queue Board' ? 'active' : ''}" class="menu-item-link">
                    <i class="fa-solid fa-users-rectangle"></i>
                    <span>Queue Board</span>
                </a>
                
                <!-- Consultation (Admin, Doctor) -->
                <a sec:authorize="hasAnyRole('ROLE_ADMIN', 'ROLE_DOCTOR')" 
                   th:href="@{/consultation}" th:classappend="${title == 'Consultation' ? 'active' : ''}" class="menu-item-link">
                    <i class="fa-solid fa-user-md"></i>
                    <span>Consultation</span>
                </a>
                
                <!-- Invoices & Billing (Admin, Cashier) -->
                <a sec:authorize="hasAnyRole('ROLE_ADMIN', 'ROLE_CASHIER')" 
                   th:href="@{/billing}" th:classappend="${title == 'Invoices' ? 'active' : ''}" class="menu-item-link">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                    <span>Billing & Payments</span>
                </a>
                
                <!-- Master Data: Specialties & Rooms (Admin Only) -->
                <a sec:authorize="hasRole('ROLE_ADMIN')" 
                   th:href="@{/admin/masterdata}" th:classappend="${title == 'Master Data' ? 'active' : ''}" class="menu-item-link">
                    <i class="fa-solid fa-hospital-user"></i>
                    <span>Specialties & Rooms</span>
                </a>

                <!-- Staff Profiles (Admin Only) -->
                <a sec:authorize="hasRole('ROLE_ADMIN')" 
                   th:href="@{/admin/staff}" th:classappend="${title == 'Staff' ? 'active' : ''}" class="menu-item-link">
                    <i class="fa-solid fa-id-card"></i>
                    <span>Staff profiles</span>
                </a>
            </nav>
            
            <!-- Sidebar Footer: Logged-in User Info & Logout -->
            <div class="sidebar-footer">
                <div class="user-profile-summary">
                    <span class="user-profile-name" sec:authentication="principal.username">Username</span>
                    <span class="user-profile-role">
                        <span sec:authorize="hasRole('ROLE_ADMIN')">Administrator</span>
                        <span sec:authorize="hasRole('ROLE_RECEPTIONIST')">Receptionist</span>
                        <span sec:authorize="hasRole('ROLE_DOCTOR')">Doctor</span>
                        <span sec:authorize="hasRole('ROLE_CASHIER')">Cashier</span>
                        <span sec:authorize="hasRole('ROLE_MANAGER')">Manager</span>
                    </span>
                </div>
                <form th:action="@{/logout}" method="post" id="logoutForm" class="m-0">
                    <button type="submit" class="btn-logout-icon" title="Sign out">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </form>
            </div>
        </aside>
        
        <!-- Main Content Area -->
        <main class="main-viewport">
            <header class="main-navbar">
                <h1 class="navbar-page-title" th:text="${title}">Page Title</h1>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-secondary px-3 py-2" sec:authentication="name">User</span>
                </div>
            </header>
            
            <section class="main-content">
                <!-- Replace with dynamic content of the page -->
                <div th:replace="${content}"></div>
            </section>
        </main>
    </div>
    
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
