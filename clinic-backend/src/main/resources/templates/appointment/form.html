<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{layout/main :: layout('Appointments', ~{::content_fragment})}">

<body>
    <div th:fragment="content_fragment">
        <!-- Link to Module-Specific CSS -->
        <link th:href="@{/css/appointment.css}" rel="stylesheet">

        <div class="glass-panel p-4 appointment-form-panel">
            <!-- Header Section -->
            <div class="mb-4">
                <h3 class="fw-bold m-0 text-white">Book Appointment</h3>
                <p class="text-secondary m-0 text-sm">Schedule a consultation slot for a patient with their preferred
                    doctor.</p>
            </div>

            <!-- Form -->
            <form th:action="@{/appointments/new}" th:object="${appointment}" method="post">
                <div class="row g-4">
                    <!-- Patient Selection -->
                    <div class="col-md-12">
                        <div class="form-group">
                            <label for="patientId" class="form-label">Select Patient <span
                                    class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <select id="patientId" th:field="*{patientId}"
                                    class="form-control-custom select-custom-arrow" required>
                                    <option value="" disabled selected>Choose Patient</option>
                                    <option th:each="pt : ${patients}" th:value="${pt.id}"
                                        th:text="${pt.fullName} + ' (' + ${pt.patientCode} + ' - ' + ${pt.phone} + ')'">
                                    </option>
                                </select>
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('patientId')}"
                                th:errors="*{patientId}">Patient Error</div>
                        </div>
                    </div>

                    <!-- Doctor Selection -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="doctorId" class="form-label">Select Doctor <span
                                    class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <select id="doctorId" th:field="*{doctorId}"
                                    class="form-control-custom select-custom-arrow" required>
                                    <option value="" disabled selected>Choose Doctor</option>
                                    <option th:each="doc : ${doctors}" th:value="${doc.id}"
                                        th:text="${doc.fullName} + ' (' + ${doc.specialtyName} + ')'"></option>
                                </select>
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('doctorId')}"
                                th:errors="*{doctorId}">Doctor Error</div>
                        </div>
                    </div>

                    <!-- Room Selection -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="roomId" class="form-label">Select Room</label>
                            <div class="input-glow-wrapper">
                                <select id="roomId" th:field="*{roomId}"
                                    class="form-control-custom select-custom-arrow">
                                    <option value="" selected>No Room (Uses Doctor's Default)</option>
                                    <option th:each="room : ${rooms}" th:value="${room.id}"
                                        th:text="${room.name} + ' (' + ${room.roomCode} + ')'"></option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Scheduled Start -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="scheduledStart" class="form-label">Scheduled Start <span
                                    class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <input type="datetime-local" id="scheduledStart" th:field="*{scheduledStart}"
                                    class="form-control-custom" required>
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('scheduledStart')}"
                                th:errors="*{scheduledStart}">Start Error</div>
                        </div>
                    </div>

                    <!-- Scheduled End -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="scheduledEnd" class="form-label">Scheduled End <span
                                    class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <input type="datetime-local" id="scheduledEnd" th:field="*{scheduledEnd}"
                                    class="form-control-custom" required>
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('scheduledEnd')}"
                                th:errors="*{scheduledEnd}">End Error</div>
                        </div>
                    </div>

                    <!-- Booking Source -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="source" class="form-label">Booking Source <span
                                    class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <select id="source" th:field="*{source}" class="form-control-custom select-custom-arrow"
                                    required>
                                    <option th:each="src : ${sources}" th:value="${src}" th:text="${src}"></option>
                                </select>
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('source')}"
                                th:errors="*{source}">Source Error</div>
                        </div>
                    </div>

                    <!-- Reason -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="reason" class="form-label">Reason for Visit</label>
                            <div class="input-glow-wrapper">
                                <input type="text" id="reason" th:field="*{reason}" class="form-control-custom"
                                    placeholder="e.g. Regular health check">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top-card">
                    <a th:href="@{/appointments}" class="btn btn-outline-secondary px-4 py-2 btn-cancel-custom">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-premium px-4 py-2 btn-premium-custom">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Book Slot
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>

<!-- Script to auto-fill end time + 20 minutes -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const startInput = document.getElementById("scheduledStart");
        const endInput = document.getElementById("scheduledEnd");

        startInput.addEventListener("change", function () {
            if (startInput.value) {
                const startDate = new Date(startInput.value);
                const endDate = new Date(startDate.getTime() + 20 * 60000); // add 20 minutes

                // Format back to YYYY-MM-DDTHH:MM
                const year = endDate.getFullYear();
                const month = String(endDate.getMonth() + 1).padStart(2, '0');
                const day = String(endDate.getDate()).padStart(2, '0');
                const hours = String(endDate.getHours()).padStart(2, '0');
                const minutes = String(endDate.getMinutes()).padStart(2, '0');

                endInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
            }
        });
    });
</script>

</html>
