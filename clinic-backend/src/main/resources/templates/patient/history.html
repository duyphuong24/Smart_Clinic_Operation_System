<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>My Medical History - Smart Clinic</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-navy mb-1"><i class="bi bi-file-earmark-medical me-2"></i>My Medical History & Records</h2>
            <p class="text-muted mb-0">Review your past clinic visits, prescriptions, and invoice statements</p>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Code</th>
                        <th>Doctor</th>
                        <th>Scheduled Date</th>
                        <th>Reason</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="appt : ${appointments}">
                        <td class="ps-4 font-monospace fw-bold text-primary" th:text="${appt.appointmentCode}">APT-001</td>
                        <td th:text="${appt.doctorName}">Dr. John</td>
                        <td th:text="${#temporals.format(appt.scheduledStart, 'yyyy-MM-dd HH:mm')}">2026-07-22 09:00</td>
                        <td th:text="${appt.reason}">Health Checkup</td>
                        <td>
                            <span class="badge bg-success" th:text="${appt.status}">BOOKED</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(appointments)}">
                        <td colspan="5" class="text-center py-4 text-muted">No medical history records found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
