<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout('Patients', ~{::content_fragment})}">
<body>
    <div th:fragment="content_fragment">
        <!-- Link to Module-Specific CSS -->
        <link th:href="@{/css/patient.css}" rel="stylesheet">

        <div class="glass-panel p-4">
            <!-- Header Section -->
            <div class="mb-4">
                <h3 class="fw-bold m-0 text-white" th:text="${isEdit} ? 'Edit Patient Profile' : 'Register New Patient'">Register New Patient</h3>
                <p class="text-secondary m-0 text-sm">Please provide correct information to register or update the patient's record.</p>
            </div>

            <!-- Form -->
            <form th:action="${isEdit} ? @{/patients/{id}/edit(id=${patientId})} : @{/patients/new}" th:object="${patient}" method="post" class="needs-validation">
                
                <div class="row g-4">
                    <!-- Section 1: Personal Details -->
                    <div class="col-100">
                        <h5 class="fw-bold mb-3 text-primary border-bottom pb-2 border-bottom-card-imp"><i class="fa-solid fa-user me-2"></i>Personal Details</h5>
                    </div>

                    <!-- Full Name -->
                    <div class="col-md-6 col-lg-4">
                        <div class="form-group">
                            <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
                            <div class="input-glow-wrapper">
                                <input type="text" id="fullName" th:field="*{fullName}" class="form-control-custom" placeholder="e.g. Nguyen Van A" required>
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Full Name Error</div>
                        </div>
                    </div>

                    <!-- Date of Birth -->
                    <div class="col-md-6 col-lg-4">
                        <div class="form-group">
                            <label for="dateOfBirth" class="form-label">Date of Birth</label>
                            <div class="input-glow-wrapper">
                                <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" class="form-control-custom">
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}">DoB Error</div>
                        </div>
                    </div>

                    <!-- Gender -->
                    <div class="col-md-6 col-lg-4">
                        <div class="form-group">
                            <label for="gender" class="form-label">Gender</label>
                            <div class="input-glow-wrapper">
                                <select id="gender" th:field="*{gender}" class="form-control-custom select-custom-arrow">
                                    <option value="" disabled selected>Select Gender</option>
                                    <option th:each="g : ${T(com.smartclinic.patient.entity.Gender).values()}" 
                                            th:value="${g}" th:text="${g}"></option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Phone -->
                    <div class="col-md-6 col-lg-4">
                        <div class="form-group">
                            <label for="phone" class="form-label">Phone Number</label>
                            <div class="input-glow-wrapper">
                                <input type="text" id="phone" th:field="*{phone}" class="form-control-custom" placeholder="e.g. 0901234567">
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Phone Error</div>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="col-md-6 col-lg-4">
                        <div class="form-group">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-glow-wrapper">
                                <input type="email" id="email" th:field="*{email}" class="form-control-custom" placeholder="e.g. example@mail.com">
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email Error</div>
                        </div>
                    </div>

                    <!-- Identity Number -->
                    <div class="col-md-6 col-lg-4">
                        <div class="form-group">
                            <label for="identityNumber" class="form-label">Identity Number (CCCD/Passport)</label>
                            <div class="input-glow-wrapper">
                                <input type="text" id="identityNumber" th:field="*{identityNumber}" class="form-control-custom" placeholder="e.g. 012345678912">
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('identityNumber')}" th:errors="*{identityNumber}">Identity Error</div>
                        </div>
                    </div>

                    <!-- Address -->
                    <div class="col-12">
                        <div class="form-group">
                            <label for="address" class="form-label">Home Address</label>
                            <div class="input-glow-wrapper">
                                <textarea id="address" th:field="*{address}" class="form-control-custom" rows="2" placeholder="Street name, District, Province..."></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Section 2: Emergency Contact & Medical Info -->
                    <div class="col-12 mt-4">
                        <h5 class="fw-bold mb-3 text-primary border-bottom pb-2 border-bottom-card-imp"><i class="fa-solid fa-circle-info me-2"></i>Emergency & Medical Information</h5>
                    </div>

                    <!-- Emergency Contact Name -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="emergencyContactName" class="form-label">Emergency Contact Name</label>
                            <div class="input-glow-wrapper">
                                <input type="text" id="emergencyContactName" th:field="*{emergencyContactName}" class="form-control-custom" placeholder="Relative's name">
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('emergencyContactName')}" th:errors="*{emergencyContactName}">Contact Name Error</div>
                        </div>
                    </div>

                    <!-- Emergency Contact Phone -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="emergencyContactPhone" class="form-label">Emergency Contact Phone</label>
                            <div class="input-glow-wrapper">
                                <input type="text" id="emergencyContactPhone" th:field="*{emergencyContactPhone}" class="form-control-custom" placeholder="e.g. 0909876543">
                            </div>
                            <div class="text-danger mt-1 text-xs" th:if="${#fields.hasErrors('emergencyContactPhone')}" th:errors="*{emergencyContactPhone}">Contact Phone Error</div>
                        </div>
                    </div>

                    <!-- Allergy Note -->
                    <div class="col-12">
                        <div class="form-group">
                            <label for="allergyNote" class="form-label">Allergy Note (if any)</label>
                            <div class="input-glow-wrapper">
                                <textarea id="allergyNote" th:field="*{allergyNote}" class="form-control-custom" rows="3" placeholder="Specify any medicine, food, or chemical allergies..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top-card">
                    <a th:href="@{/patients}" class="btn btn-outline-secondary px-4 py-2 btn-cancel-custom">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-premium px-4 py-2 btn-premium-custom">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Save Record
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
