<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout(${title}, ~{::content_fragment})}">
<body>
    <div th:fragment="content_fragment">
        <!-- Link to Module-Specific CSS -->
        <link th:href="@{/css/error.css}" rel="stylesheet">

        <div class="glass-panel p-5 text-center error-panel">
            <div class="d-inline-flex align-items-center justify-content-center bg-dark-subtle rounded-circle mb-4 error-icon-box">
                <i class="fa-solid error-icon-symbol" th:classappend="${icon}"></i>
            </div>
            
            <h3 class="fw-bold text-white mb-2" th:text="${moduleName}">Module Name</h3>
            <p class="text-secondary mb-4 error-desc-text" th:text="${description}">Short description of the module.</p>
            
            <div class="p-3 rounded text-start mb-4 error-details-box">
                <i class="fa-solid fa-circle-info text-info me-2"></i>
                <span th:text="${details}">Additional module specification and architecture info.</span>
            </div>
            
            <a th:href="@{/dashboard}" class="btn btn-premium px-4 py-2 btn-premium-custom">
                <i class="fa-solid fa-house me-2"></i>Go to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
