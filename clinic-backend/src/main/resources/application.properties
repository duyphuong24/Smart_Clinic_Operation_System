spring.config.import=optional:file:.env[.properties],optional:file:clinic-backend/.env[.properties]

# ==========================================
# CẤU HÌNH KẾT NỐI DATABASE (SQL SERVER)
# ==========================================
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:HSF302_SmartClinic};encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:your_strong_password}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# CẤU HÌNH CONNECTION POOL (HIKARICP)
# ==========================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# CẤU HÌNH JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create

# JWT settings for stateless REST API authentication
smartclinic.jwt.signer-key=${JWT_SIGNER_KEY:dGVzdC1zaWduZXIta2V5LXNob3VsZC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25nLWZvci1zaWduaW5nLXVzZQ==}
smartclinic.jwt.access-token-valid-seconds=${JWT_VALID_DURATION:3600}
smartclinic.jwt.refresh-token-valid-seconds=${JWT_REFRESHABLE_DURATION:604800}

# ==========================================
# CẤU HÌNH PAYOS PAYMENT GATEWAY
# ==========================================
payos.client-id=${PAYOS_CLIENT_ID:dummy-client-id}
payos.api-key=${PAYOS_API_KEY:dummy-api-key}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:dummy-checksum-key}

# ==========================================
# CẤU HÌNH MAIL & NOTIFICATION
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:smartclinic.notifications@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

smartclinic.notification.email-enabled=${EMAIL_ENABLED:false}
smartclinic.notification.from-email=${MAIL_FROM:noreply@smartclinic.com}
