spring.config.import=optional:file:.env[.properties],optional:file:clinic-backend/.env[.properties]

# ==========================================
# CẤU HÌNH KẾT NỐI DATABASE (SQL SERVER)
# ==========================================
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:smart_clinic};encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:your_strong_password}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# CẤU HÌNH CONNECTION POOL (HIKARICP)
# ==========================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# CẤU HÌNH JPA / HIBERNATE
# ==========================================
# Dialect giúp Hibernate biết cách sinh ra câu lệnh SQL chuẩn cho SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Bật/tắt log câu lệnh SQL trên console (Nên để false trên Production)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ddl-auto: update (cho dev), validate/none (cho production)
spring.jpa.hibernate.ddl-auto=update

# JWT settings for stateless REST API authentication
smartclinic.jwt.signer-key=${JWT_SIGNER_KEY:dGVzdC1zaWduZXIta2V5LXNob3VsZC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25nLWZvci1zaWduaW5nLXVzZQ==}
smartclinic.jwt.access-token-valid-seconds=${JWT_VALID_DURATION:3600}
smartclinic.jwt.refresh-token-valid-seconds=${JWT_REFRESHABLE_DURATION:604800}
